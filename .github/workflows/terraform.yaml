# .github/workflows/terraform-checks.yaml
name: Terraform checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
  workflow_call:

jobs:
  pull-request-terraform-checks:
    name: PR Terraform checks
    uses: canonical/workflows-team/.github/workflows/terraform.yaml@ci/add-goss-installation
    with:
      module-directory: ./modules/charmed-airflow
      timeout-minutes: 40
