command:
  api-health-check-components:
    exec: >-
      curl -fsS --retry 5 --retry-delay 5 --retry-all-errors
      http://airflow-api-server-endpoints.airflow-test.svc.cluster.local:8080/api/v2/monitor/health
      | jq -e 'all(.[]; .status == "healthy")'
    exit-status: 0
    stdout:
      - "true"
