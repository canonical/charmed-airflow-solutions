command:
  install-deps:
    exec: |
      apt update && apt install -y curl jq
    exit-status: 0
  api-health-check-ready:
    exec: >-
      curl -fsS http://airflow-api-server-endpoints.airflow-test.svc.cluster.local:8080/api/v2/monitor/health
      | jq -e 'all(.[]; .status == "healthy")'
    exit-status: 0
    stdout:
      - "true"
